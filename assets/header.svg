<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1026"/>
      <stop offset=".55" stop-color="#132B52"/>
      <stop offset="1" stop-color="#1F8A7A"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#99F6E4" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle cx="1080" cy="300" r="170" fill="#2DD4BF" fill-opacity=".35" filter="url(#blur)"/>
    <circle cx="120" cy="40" r="140" fill="#3B82F6" fill-opacity=".25" filter="url(#blur)"/>

    <!-- twinkling stars -->
    <g fill="#E0F2FE">
      <circle cx="80" cy="250" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="90" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="300" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="60" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="40" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="320" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="170" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- constellation as a small neural net (AI motif) -->
    <g stroke="#99F6E4" stroke-opacity=".35" stroke-width="1.5">
      <path d="M940 70L1010 115L1090 80M1010 115L995 190L1075 175L1090 80M995 190L930 160L940 70M1075 175L1140 220"/>
    </g>
    <g fill="#CCFBF1">
      <circle cx="940" cy="70" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="115" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="80" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="995" cy="190" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1075" cy="175" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="160" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="220" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- a signal pulse travelling along one edge path -->
    <circle r="3.5" fill="#FFFFFF">
      <animateMotion path="M940 70L1010 115L995 190L1075 175L1140 220" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- shooting stars -->
    <g opacity="0">
      <path d="M0 0L-110-50" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
      <circle r="3.5" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="translate" values="120 -40; 720 230" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.25;.7;1" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <path d="M0 0L-70-32" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="2.5" fill="#E0F2FE"/>
      <animateTransform attributeName="transform" type="translate" values="560 -30; 1000 170" dur="2.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.15;.3;.7;1" dur="2.3s" begin="1.6s" repeatCount="indefinite"/>
    </g>

    <text x="600" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="1">LEE JAEHOON</text>
    <text x="600" y="214" text-anchor="middle" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6">BUILDING AI PEOPLE USE EVERY DAY</text>
    <rect x="530" y="248" width="140" height="2" rx="1" fill="#5EEAD4" opacity=".7">
      <animate attributeName="width" values="40;140;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="580;530;580" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
